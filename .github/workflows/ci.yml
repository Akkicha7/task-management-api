# GitHub Actions CI pipeline for Task Management API
# This workflow runs on pushes and pull‑requests to the main branch.
# It builds the Maven project, runs all tests, and builds a Docker image.

name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Verify with Maven (compile, test, package)
        run: mvn -B verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (optional – only needed if you push)
        # Uncomment and set secrets if you wish to push the image.
        # uses: docker/login-action@v3
        # with:
        #   username: ${{ secrets.DOCKER_HUB_USERNAME }}
        #   password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false   # set to true to push to a registry
          tags: taskproject:latest

      - name: Report build status
        if: always()
        run: echo "CI pipeline completed with status ${{ job.status }}"
