# -----------------------------------------------------------------
# Server configuration
# -----------------------------------------------------------------
server.port=8081

# -----------------------------------------------------------------
# DataSource - supplied via environment vars; fallbacks for local dev
# -----------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskproject?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:TempReset_82!ChangeMe}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------------------------
# JWT Configuration
# jwt.secret MUST be a Base64-encoded string whose decoded length is
# >= 32 bytes (256 bits) to satisfy JJWT HMAC-SHA256 requirements.
#
# PRODUCTION: Set the JWT_SECRET environment variable to a freshly
# generated Base64 secret.  Never commit a real production secret.
#
# PowerShell one-liner to generate a new secret:
#   $b = New-Object byte[] 32
#   [System.Security.Cryptography.RNGCryptoServiceProvider]::Create().GetBytes($b)
#   [Convert]::ToBase64String($b)
# -----------------------------------------------------------------
jwt.secret=${JWT_SECRET:K/ypZWiy1fWPO8X4Msl0nPDXQANGj6wyn7QNtI5bKGk=}
jwt.expiration-ms=3600000
