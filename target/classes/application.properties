# -----------------------------------------------------------------
# Server configuration
# -----------------------------------------------------------------
server.port=8081

# -----------------------------------------------------------------
# DataSource - H2 in-memory (no MySQL required for local dev)
# To switch to MySQL, set DB_URL, DB_USERNAME, DB_PASSWORD env vars
# -----------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:taskproject;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# -----------------------------------------------------------------
# H2 Console (available at http://localhost:8081/h2-console)
# Disable in production!
# -----------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# -----------------------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------------------------
# JWT Configuration
# jwt.secret MUST be a Base64-encoded string whose decoded length is
# >= 32 bytes (256 bits) to satisfy JJWT HMAC-SHA256 requirements.
#
# PRODUCTION: Set the JWT_SECRET environment variable to a freshly
# generated Base64 secret.  Never commit a real production secret.
#
# PowerShell one-liner to generate a new secret:
#   $b = New-Object byte[] 32
#   [System.Security.Cryptography.RNGCryptoServiceProvider]::Create().GetBytes($b)
#   [Convert]::ToBase64String($b)
# -----------------------------------------------------------------
jwt.secret=${JWT_SECRET:K/ypZWiy1fWPO8X4Msl0nPDXQANGj6wyn7QNtI5bKGk=}
jwt.expiration-ms=3600000
